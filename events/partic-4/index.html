<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom File Upload</title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
}

#fileinp{
    display:none;
}

#btn{
    padding:15px 35px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

#btn:hover{
    background:#1d4ed8;
}
    </style>
</head>
<body>

    <!-- Hidden File Input -->
    <input type="file" id="fileinp">

    <!-- Custom Button -->
    <button id="btn">Choose File</button>

    <script src="script.js"></script>

</body>
</html>
